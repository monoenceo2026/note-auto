name: note-publish

# ⚠️ 検証の結論（2026-07-18）:
#   note.com は自動投稿を能動的にブロックします。実測で、noteのエディタ自身が読み込み時に
#   叩く下書き作成 API `POST /api/v1/text_notes` が 422 を返し、エディタがローディングの
#   まま描画されません（＝bot/CSRF対策による書き込み拒否）。非公式APIを直接叩いても同じ 422。
#   これを突破するには bot 検知の回避が必要で、それは行いません（規約・ポリシー上不可）。
#   → note への投稿は「半自動（生成は全自動→人が約2分で公開）」が正式サポートの運用です。
#      詳細は docs/NOTE_POSTING.md。
#
# このワークフローは参考・将来用に残します（定時実行は無効。手動実行のみ）。
# note 側の仕様が変わった場合の再検証にどうぞ。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=公開ボタンを押さない（下書きで停止・テスト）"
        default: "1"
        type: string
      publish_mode:
        description: "auto=公開 / draft=下書きまで"
        default: "draft"
        type: string
      article_dir:
        description: "対象記事dir（空なら最新日付を自動選択）"
        default: ""
        type: string
      probe_only:
        description: "1=エディタDOMを調べて結果に記録するだけ（投稿しない）"
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: note-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Post to note
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
          NOTE_USERNAME: ${{ vars.NOTE_USERNAME || 'monoen_co_jp' }}
          PUBLISH_MODE: ${{ github.event.inputs.publish_mode || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ARTICLE_DIR: ${{ github.event.inputs.article_dir || '' }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || '0' }}
        run: python scripts/note_playwright_post.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug
          path: articles/**/_debug/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit publish result
        if: always()
        run: |
          git config user.name "monoen-note-bot"
          git config user.email "bot@users.noreply.github.com"
          git add articles/**/publish_result.json registry/content-registry.json 2>/dev/null || true
          git commit -m "note-publish: record result [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
